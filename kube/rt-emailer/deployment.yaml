apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: rt-emailer
  name: rt-emailer
spec:
  selector:
    matchLabels:
      name: rt-emailer
  replicas: {{.RT_EMAILER_REPLICAS}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        name: rt-emailer
    spec:
      initContainers:
      - name: certs
        image: quay.io/ukhomeofficedigital/cfssl-sidekick:v1.0.0-rc1
        securityContext:
          runAsNonRoot: true
        args:
        - --certs=/mnt/certs
        - --domain=rt-emailer.${KUBE_NAMESPACE}.svc.cluster.local
        - --expiry=8760h
        - --onetime=true
        env:
          - name: KUBE_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        volumeMounts:
        - name: certs
          mountPath: /mnt/certs
        - name: bundle
          mountPath: /etc/ssl/certs
          readOnly: true
      - name: mongo-client-certs
        image: quay.io/ukhomeofficedigital/cfssl-sidekick:v1.0.0-rc1
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        args:
          - --certs=/mnt/certs
          - --tls-cert-name=mongo-client.pem
          - --tls-key-name=mongo-client-key.pem
          - --domain=repo
          - --organization=mongo-users
          - --expiry=8760h
          - --onetime=true
        volumeMounts:
          - name: certs
            mountPath: /mnt/certs
          - name: bundle
            mountPath: /etc/ssl/certs
            readOnly: true
      - name: create-keystore
        image: quay.io/ukhomeofficedigital/cfssl-sidekick-jks:v1.0.0-rc1
        securityContext:
          runAsNonRoot: true
        env:
          - name: KEYSTORE_RUNTIME
            value: /mnt/certs/keystore
          - name: IMPORT_SYSTEM_TRUSTSTORE
            value: "true"
        args:
          - --certs=/mnt/certs
          - --domain=rt-emailer.{{.KUBE_NAMESPACE}}.svc.cluster.local
          - --domain=rt-emailer
          - --organization=mongo-users
          - --onetime=true
          - --command=/usr/bin/create-keystore.sh /mnt/certs/tls.pem /mnt/certs/tls-key.pem /etc/ssl/certs/acp-root.crt
          - --expiry=8760h
        volumeMounts:
          - name: certs
            mountPath: /mnt/certs
          - name: bundle
            mountPath: /etc/ssl/certs
            readOnly: true
      containers:
      - name: rt-emailer
        image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/rtge/rt-emailer:{{.IMAGE_VERSION}}
        imagePullPolicy: Always
        resources:
          limits:
            memory: 2Gi
        ports:
        - containerPort: 8085
        env:
        - name: TZ
          value: "Europe/London"
        - name: DB_SSL
          value: "true"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: mongo_host
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: mongo_dbname
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: mongo_username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo
              key: caseworker
        - name: SENDER
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: sender
        - name: SENDER_NAME
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: senderName
        - name: REPLY_TO
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: replyTo
        - name: REPLY_TO_NAME
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: replyToName
        - name: SMTP_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: rt-emailer
              key: smtpport
        - name: SMTP_SERVER_HOST
          valueFrom:
            secretKeyRef:
              name: {{.SES_SECRET_NAME}}
              key: smtp_server
        - name: SMTP_SERVER_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{.SES_SECRET_NAME}}
              key: smtp_username
        - name: SMTP_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{.SES_SECRET_NAME}}
              key: smtp_password
        - name: GOV_NOTIFY_API_KEY
          valueFrom:
            secretKeyRef:
              name: gov-notify
              key: api_key
        - name: GOV_NOTIFY_API_KEY2
          valueFrom:
            secretKeyRef:
              name: gov-notify
              key: api_key2
        - name: CASEWORKER_HOST
          value: "https://{{.CASEWORKER_UKC_DNS}}"
        - name: CUSTOMER_HOST
          value: "https://{{.RT_CUSTOMER_DNS}}"
        - name: CUSTOMER_GLOBAL_ENTRY_HOST
          value: "https://{{.GE_CUSTOMER_DNS}}"
        - name: STATSD_HOST
          value: "127.0.0.1"
        - name: JAVA_OPTS
          value: |
            -Djavax.net.ssl.keyStore=/mnt/certs/keystore/keystore.jks
            -Djavax.net.ssl.keyStorePassword=changeit
            -Djavax.net.ssl.keyStoreType=JKS
            -Djavax.net.ssl.trustStore=/mnt/certs/keystore/truststore.jks
            -Djavax.net.ssl.trustStorePassword=changeit
            -Djavax.net.ssl.trustStoreType=JKS
            -Djava.security.egd=file:/dev/./urandom
        livenessProbe:
          httpGet:
            path: /status
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 180
          timeoutSeconds: 180
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /status
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 180
          timeoutSeconds: 180
          successThreshold: 1
          failureThreshold: 5
        volumeMounts:
          - name: certs
            mountPath: /mnt/certs
          - name: bundle
            mountPath: /etc/ssl/certs
            readOnly: true
      imagePullSecrets:
      - name: artifactory-read-only
      volumes:
        - name: bundle
          configMap:
            name: bundle
        - name: certs
          emptyDir: {}
